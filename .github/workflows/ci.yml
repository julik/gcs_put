name: CI

on:
  - push

env:
  BUNDLE_PATH: vendor/bundle

jobs:
  test_and_lint_minimum_ruby:
    name: Tests/Lint (3.2)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2
          bundler-cache: true
      - name: GCP test credentials
        env:
          GCP_TEST_CREDENTIALS_JSON: ${{ secrets.GCP_TEST_CREDENTIALS_JSON }}
        if: env.GCP_TEST_CREDENTIALS_JSON != ''
        run: |
          echo "$GCP_TEST_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
      - name: "Tests"
        run: bundle exec rake test --backtrace
      - name: "Lint"
        run: bundle exec rake standard
  test_recent_ruby:
    name: Tests (3.4)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true
      - name: GCP test credentials
        env:
          GCP_TEST_CREDENTIALS_JSON: ${{ secrets.GCP_TEST_CREDENTIALS_JSON }}
        if: env.GCP_TEST_CREDENTIALS_JSON != ''
        run: |
          echo "$GCP_TEST_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcp.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp.json" >> "$GITHUB_ENV"
      - name: "Tests"
        run: bundle exec rake test --backtrace
